name: Check Links

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  links:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config ./.github/lychee.toml --no-progress './*.md'
          fail: true
