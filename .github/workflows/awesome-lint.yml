name: Awesome Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The git-repo-age rule needs the full history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npx awesome-lint
      - name: Check entry format
        run: sh scripts/check-entry-format.sh README.md pitfalls.md security-references.md
